    <h2>Task 6: Dual Axis</h2>
    <iframe src="task6_dual_axis_chart.html" width="100%" height="500"></iframe>
</div>

<script>
function checkTime(start, end, id){
    const now = new Date();
    const options = { timeZone: 'Asia/Kolkata', hour: '2-digit', hour12: false };
    const hour = parseInt(new Intl.DateTimeFormat('en-US', options).format(now));

    if(hour >= start && hour < end){
        document.getElementById(id).style.display = "block";
    } else {
        document.getElementById(id).style.display = "none";
    }
}

window.onload = function(){
    checkTime(17,19,"task1"); // 5–7 PM
    checkTime(18,20,"task2"); // 6–8 PM
    checkTime(18,21,"task3"); // 6–9 PM
    checkTime(16,18,"task4"); // 4–6 PM
    checkTime(15,17,"task5"); // 3–5 PM
    checkTime(13,14,"task6"); // 1–2 PM
}
</script>

</body>
